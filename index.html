function genSide(job,idx,S){

  else{const t=clamp((n-.3)*2.1);r=lerp(58,172,t);g=lerp(28,80,t);b=lerp(14,30,t);if(d>.6){const k=(d-.6)*3;r+=58*k;g+=40*k;b+=10*k}}

  x.shadowColor='rgba(255,255,255,.45)';x.shadowBlur=3*S;x.shadowOffsetX=1.6*S+5000;x.shadowOffsetY=1.8*S;x.drawImage(inv,-20*S-5000,-20*S);x.shadowColor='transparent';x.scale(S,S)});
